# Studio owner sign-up, end to end, on a throwaway LOCAL Supabase. Never touches production
# and uses no repository secrets. Registers an owner, walks onboarding, launches, signs back in,
# then checks the rows the onboarding function wrote.
name: owner-signup-e2e
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pages/auth/**'
      - 'src/pages/manage/Onboarding.tsx'
      - 'src/components/auth/**'
      - 'src/lib/auth/**'
      - 'src/contexts/AuthContext.tsx'
      - 'src/pages/manage/Teachers.tsx'
      - 'src/pages/manage/LiveTeam.tsx'
      - 'supabase/functions/onboarding/**'
      - 'supabase/migrations/**'
      - 'e2e-owner/**'
      - '.github/workflows/owner-signup-e2e.yml'
permissions:
  contents: read
jobs:
  owner-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: CLI 3.3+ writes supabase/config.jsonc on init, and the next
          # step edits supabase/config.toml. 3.2.0 is the last version this job passed on.
          version: 3.2.0
      - name: Start local Supabase (applies supabase/migrations)
        run: |
          supabase init < /dev/null || true
          test -f supabase/config.toml
          # Invite emails must be allowed to send staff to the locally served web app.
          sed -i -E 's|^site_url = .*|site_url = "http://localhost:4303"|; s|^additional_redirect_urls = .*|additional_redirect_urls = ["http://localhost:4303/**"]|' supabase/config.toml
          grep -E '^(site_url|additional_redirect_urls)' supabase/config.toml
          supabase start -x realtime,studio,imgproxy,logflare,vector,supavisor,postgres-meta
          supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/SB_\1=\2/' >> "$GITHUB_ENV"
      - name: Serve edge functions locally
        run: |
          (supabase functions serve > /tmp/functions.log 2>&1 &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$SB_API_URL/functions/v1/onboarding" || true)
            [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ] && break; sleep 2
          done
          echo "onboarding preflight: $code"
      - name: Build the web app against local Supabase
        run: |
          VITE_SUPABASE_URL="$SB_API_URL" VITE_SUPABASE_ANON_KEY="$SB_ANON_KEY" VITE_DEMO_MODE=false \
          VITE_LEGAL_HOSTED=true VITE_BLOG_GAMES=false npx vite build --outDir dist-owner --logLevel warn
          (npx vite preview --outDir dist-owner --port 4303 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4303/auth/register && break; sleep 2; done
      - name: Playwright image
        timeout-minutes: 8
        run: docker pull -q mcr.microsoft.com/playwright:v1.64.0-noble
      - name: Owner sign-up and onboarding
        run: |
          PW=$(openssl rand -hex 16); echo "::add-mask::$PW"; echo "OWNER_PW=$PW" >> "$GITHUB_ENV"
          docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e OWNER_EMAIL="owner-${{ github.run_id }}@juniper.example" -e OWNER_PASSWORD="$PW" -e RUN_ID="${{ github.run_id }}" -e API_URL="$SB_API_URL" -e ANON_KEY="$SB_ANON_KEY" \
            -v "$PWD:/w" -w /w mcr.microsoft.com/playwright:v1.64.0-noble node e2e-owner/owner-signup.mjs owner-out
      - name: Check the rows onboarding wrote
        if: always()
        run: |
          psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -c "
            select s.name, s.page_live, s.currency,
              (select count(*) from studio_staff st join auth.users u on u.id = st.profile_id
                 where st.studio_id = s.id and st.role = 'owner' and u.email like 'owner-%@juniper.example') as owners,
              (select count(*) from locations l where l.studio_id = s.id) as locations,
              (select count(*) from offerings o where o.studio_id = s.id) as offerings,
              (select count(*) from schedule_rules r where r.studio_id = s.id) as schedule_rules,
              (select count(*) from membership_types m where m.studio_id = s.id) as memberships,
              (select count(*) from class_pack_types p where p.studio_id = s.id) as packs,
              (select count(*) from waiver_templates w where w.studio_id = s.id) as waivers
            from studios s where s.name = 'Juniper Test Studio';" | tee owner-out/db-check.txt
          psql "$SB_DB_URL" -tA -c "select count(*) from studios s where s.name='Juniper Test Studio' and s.page_live
            and exists (select 1 from offerings o where o.studio_id=s.id)
            and exists (select 1 from schedule_rules r where r.studio_id=s.id)" | grep -qx 1
          set -x
          # Offboarding, checked in the database: the teacher from setup is given a weekly slot and an
          # upcoming class, then the owner turns them off. Access flag, class handover and the
          # audit trail must all agree.
          TEACHER=$(psql "$SB_DB_URL" -tA -c "select st.profile_id from studio_staff st join studios s on s.id=st.studio_id where s.name='Juniper Test Studio' and st.role='teacher'")
          STAFF_ROW=$(psql "$SB_DB_URL" -tA -c "select st.id from studio_staff st where st.profile_id='$TEACHER'")
          psql "$SB_DB_URL" -v ON_ERROR_STOP=1 -q -c "
            update schedule_rules set teacher_id='$TEACHER' where studio_id=(select id from studios where name='Juniper Test Studio');
            insert into class_occurrences (studio_id, offering_id, location_id, teacher_id, starts_at, ends_at, capacity)
              select r.studio_id, r.offering_id, r.location_id, '$TEACHER', now() + interval '2 days', now() + interval '2 days 1 hour', 20
              from schedule_rules r where r.teacher_id='$TEACHER' limit 1;"
          TOKEN=$(curl -fsS "$SB_API_URL/auth/v1/token?grant_type=password" -H "apikey: $SB_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"owner-${{ github.run_id }}@juniper.example\",\"password\":\"$OWNER_PW\"}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          curl -fsS "$SB_API_URL/functions/v1/onboarding" -H "apikey: $SB_ANON_KEY" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"step\":\"staff_set_active\",\"data\":{\"staffId\":\"$STAFF_ROW\",\"active\":false}}" | tee -a owner-out/db-check.txt | tee /dev/stderr | grep -Eq '"unassignedClasses":[1-9]'
          psql "$SB_DB_URL" -tA -c "select
              (select count(*) from studio_staff where profile_id='$TEACHER' and is_active) || '|' ||
              (select count(*) from class_occurrences where teacher_id='$TEACHER' and starts_at > now()) || '|' ||
              (select count(*) from schedule_rules where teacher_id='$TEACHER') || '|' ||
              (select count(*) from audit_logs where category='staff' and action='staff.access_removed' and actor_email like 'owner-%' and previous_state->>'is_active'='true') || '|' ||
              (select count(*) from audit_logs where category='staff' and action='staff.role_changed') || '|' ||
              (select count(*) from audit_logs where category='staff' and action='staff.added')" | tee -a owner-out/db-check.txt | grep -qx '0|0|0|2|1|2'
      - name: Logs on failure
        if: failure()
        run: tail -n 120 /tmp/functions.log /tmp/web.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-signup-e2e
          path: owner-out/
          retention-days: 7
