# Blocks a pull request that adds a secret (API keys, tokens, private keys).
# Rules live in .gitleaks.toml. Runs on pull requests only, so the merge push doesn't run it again.
name: Secret scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan the commits in this change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"; else range="HEAD"; fi
          ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --log-opts="$range" .
