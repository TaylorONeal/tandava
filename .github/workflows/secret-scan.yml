# Blocks a pull request that adds a secret (API keys, tokens, private keys).
# Rules live in .gitleaks.toml. Every commit in the range is scanned, merges included (-m), and a self-test proves the rules still catch keys. Runs on pull requests only, so the merge push doesn't run it again.
name: Secret scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
      - name: Self-test the rules
        # Synthetic keys made at run time in a throwaway repo, so no secret is ever committed.
        run: |
          set -u
          rand() { head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
          cfg="$PWD/.gitleaks.toml"; gl="$PWD/gitleaks"; t=$(mktemp -d)
          git -C "$t" init -q && git -C "$t" config user.email ci@localhost && git -C "$t" config user.name ci
          printf 'REVENUECAT_SECRET_KEY=sk_%s\n' "$(rand 32)" > "$t/old.env"
          git -C "$t" add -A && git -C "$t" commit -qm leak && old=$(git -C "$t" rev-parse HEAD)
          git -C "$t" rm -q old.env
          printf 'REVENUECAT_SECRET_KEY=<from the RevenueCat dashboard>\nCM_TOKEN="$CM_API_TOKEN"\n' > "$t/ok.md"
          git -C "$t" add -A && git -C "$t" commit -qm clean
          expect() { want=$1; shift; got=0; "$gl" "$@" --config "$cfg" --no-banner --redact >/dev/null 2>&1 || got=$?; [ "$got" = "$want" ] || { echo "self-test failed: gitleaks $* exited $got, wanted $want"; exit 1; }; }
          expect 1 git --log-opts="-1 $old" "$t"
          expect 0 git --log-opts="-m $old..HEAD" "$t"
          # A key added and removed on a side branch, then merged, must still fail.
          base=$(git -C "$t" rev-parse HEAD); git -C "$t" checkout -qb side
          printf 'sk_%s\n' "$(rand 32)" > "$t/side.txt"; git -C "$t" add -A && git -C "$t" commit -qm add
          git -C "$t" rm -q side.txt && git -C "$t" commit -qm remove
          git -C "$t" checkout -q - && git -C "$t" merge -q --no-ff --no-edit side
          expect 1 git --log-opts="-m $base..HEAD" "$t"
          expect 0 dir "$t/ok.md"
          printf 'export CM_API_TOKEN="%s"\n' "$(rand 43)" > "$t/cm.md"; expect 1 dir "$t/cm.md"
          printf 'SUPABASE_JWT_SECRET=%s\n' "$(rand 40)" > "$t/jwt.env"; expect 1 dir "$t/jwt.env"
          echo "self-test: a RevenueCat key, a Codemagic token and a JWT secret are caught; placeholders and old history pass"
      - name: Scan the commits in this change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"; else range="HEAD"; fi
          ./gitleaks git --config .gitleaks.toml --redact --verbose --no-banner --log-opts="-m $range" .
