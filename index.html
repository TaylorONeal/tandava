<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FFF8EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tandava" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tandava | Studio software for yoga and pilates studios</title>
    <meta name="description" content="Set up your yoga, pilates or barre studio on the web: schedule, class packs, memberships, online booking and check-in." />
    <meta name="author" content="Tandava" />

    <!-- Open Graph (social sharing). Prerendered pages replace these per page. -->
    <meta property="og:title" content="Tandava | Studio software for yoga and pilates studios" />
    <meta property="og:description" content="Set up your studio on the web. Check people in from your phone." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tandava" />
    <meta property="og:image" content="https://tandavastudio.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tandava | Studio software for yoga and pilates studios" />
    <meta name="twitter:description" content="Set up your studio on the web. Check people in from your phone." />
    <meta name="twitter:image" content="https://tandavastudio.com/og-image.png" />

    <!-- Google Fonts for Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root">
      <!-- Visible while React loads. Replaced on mount. -->
      <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0a14;color:#f5f0e8;font-family:'DM Sans',sans-serif">
        <div style="text-align:center">
          <p style="font-family:'Cormorant Garamond',serif;font-size:2rem;margin-bottom:0.5rem">Tandava</p>
          <p style="opacity:0.6;font-size:0.875rem">Loading...</p>
        </div>
      </div>
    </div><!-- /root: scripts/prerender-*.ts anchor here, keep it -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- No inline scripts: the CSP (vercel.json) blocks them. The service worker
         (public/sw.js) is not registered; its cache-everything strategy needs a
         review before it ships. -->
  </body>
</html>
